spring.application.name=Student Management System

server.port=29909
server.forward-headers-strategy=framework

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/gen_0cd68058ca0d?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Flyway is the single source of truth for schema management; Hibernate does not
# validate/alter the schema (avoids native-ENUM vs VARCHAR schema-validation mismatches).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Seed data after flyway migration (flyway manages schema; no need to defer for Hibernate)
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yc3R1ZGVudG1hbmFnZW1lbnRzeXN0ZW1qd3RzaWduaW5nMjAyNA==}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION:1800000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

logging.level.org.springframework.security=INFO
logging.level.com.example.app=INFO
